services:
  cronogpt:
    build:
      context: .
      dockerfile: Dockerfile
    image: cronogpt:oci
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: ${PORT:-8787}
    ports:
      - "${CRONOGPT_HOST_PORT:-8787}:${PORT:-8787}"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 8787) + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
