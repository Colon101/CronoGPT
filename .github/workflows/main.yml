name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  deploy-oracle:
    name: Deploy Oracle production
    needs: ci
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: oracle-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://cronogpt.129-159-156-186.sslip.io/mcp
    env:
      ORACLE_HOST: 129.159.156.186
      ORACLE_DOMAIN: cronogpt.129-159-156-186.sslip.io
      ORACLE_USER: ubuntu
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Validate required secrets
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for key in ORACLE_SSH_PRIVATE_KEY; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/cronogpt_oracle_ed25519"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "ORACLE_SSH_KEY=$key_path" >> "$GITHUB_ENV"
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i "$key_path" -o BatchMode=yes "$ORACLE_USER@$ORACLE_HOST" "true"

      - name: Deploy to Oracle
        env:
          # The workflow runs one explicit smoke after loading the preserved remote token.
          ORACLE_SKIP_SMOKE: "true"
          CRONOGPT_API_TOKEN: ${{ secrets.CRONOGPT_API_TOKEN }}
          CRONOGPT_LINK_SECRET: ${{ secrets.CRONOGPT_LINK_SECRET }}
          CRONOMETER_EMAIL: ${{ secrets.CRONOMETER_EMAIL }}
          CRONOMETER_PASSWORD: ${{ secrets.CRONOMETER_PASSWORD }}
          CRONOMETER_STORAGE_STATE_BASE64: ${{ secrets.CRONOMETER_STORAGE_STATE_BASE64 }}
        run: npm run oracle:deploy

      - name: Load smoke-test token from Oracle
        run: |
          set -euo pipefail
          token="$(
            ssh -i "$ORACLE_SSH_KEY" -o BatchMode=yes "$ORACLE_USER@$ORACLE_HOST" \
              "awk -F= '\$1 == \"CRONOGPT_API_TOKEN\" { sub(/^[^=]*=/, \"\"); print; exit }' /opt/cronogpt/secrets/cronogpt.env"
          )"
          if [[ -z "$token" ]]; then
            echo "Remote CRONOGPT_API_TOKEN is missing after deploy." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "CRONOGPT_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Smoke test production
        env:
          CRONOGPT_SMOKE_SKIP_BROWSER: ${{ vars.CRONOGPT_SMOKE_SKIP_BROWSER || 'false' }}
        run: npm run smoke:oracle
