<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CronoGPT</title>
    <style>
      :root {
        color: #16201b;
        background: #f7f7f4;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 14px;
      }

      main {
        display: grid;
        gap: 12px;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .status {
        font-size: 12px;
        color: #4b5b52;
        white-space: nowrap;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        min-height: 34px;
        border: 1px solid #b9c9bd;
        border-radius: 7px;
        background: #ffffff;
        color: #16201b;
        padding: 0 11px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .panel {
        border: 1px solid #d6ddd7;
        border-radius: 8px;
        background: #ffffff;
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 10px 12px;
        border-bottom: 1px solid #e5e9e5;
        font-size: 14px;
      }

      pre {
        margin: 0;
        min-height: 180px;
        max-height: 360px;
        overflow: auto;
        padding: 12px;
        color: #213127;
        background: #fbfcfa;
        font-size: 12px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>CronoGPT</h1>
        <div id="status" class="status">Connecting</div>
      </header>

      <div class="toolbar">
        <button type="button" data-tool="cronometer_capabilities">Capabilities</button>
        <button type="button" data-tool="get_daily_summary">Today</button>
        <button type="button" data-tool="list_food_entries">Foods</button>
        <button type="button" data-tool="list_biometrics">Biometrics</button>
        <button type="button" data-tool="list_exercises">Exercises</button>
      </div>

      <section class="panel">
        <h2>Result</h2>
        <pre id="output">{}</pre>
      </section>
    </main>

    <script type="module">
      const statusEl = document.querySelector("#status");
      const outputEl = document.querySelector("#output");
      const buttons = [...document.querySelectorAll("button[data-tool]")];
      const today = new Date().toISOString().slice(0, 10);
      let rpcId = 0;
      const pendingRequests = new Map();

      const show = (value) => {
        outputEl.textContent = JSON.stringify(value, null, 2);
      };

      const rpcNotify = (method, params) => {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      };

      const rpcRequest = (method, params) =>
        new Promise((resolve, reject) => {
          const id = ++rpcId;
          pendingRequests.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;

          if (typeof message.id === "number") {
            const pending = pendingRequests.get(message.id);
            if (!pending) return;
            pendingRequests.delete(message.id);
            if (message.error) pending.reject(message.error);
            else pending.resolve(message.result);
            return;
          }

          if (message.method === "ui/notifications/tool-result") {
            show(message.params?.structuredContent ?? message.params);
          }
        },
        { passive: true },
      );

      const bridgeReady = (async () => {
        await rpcRequest("ui/initialize", {
          appInfo: { name: "cronogpt-widget", version: "0.1.0" },
          appCapabilities: {},
          protocolVersion: "2026-01-26",
        });
        rpcNotify("ui/notifications/initialized", {});
        statusEl.textContent = "Ready";
      })();

      async function callTool(name) {
        await bridgeReady;
        const args = name === "cronometer_capabilities" ? {} : { date: today };
        buttons.forEach((button) => (button.disabled = true));
        statusEl.textContent = "Working";
        try {
          const result = await rpcRequest("tools/call", { name, arguments: args });
          show(result?.structuredContent ?? result);
        } catch (error) {
          show({ ok: false, error });
        } finally {
          buttons.forEach((button) => (button.disabled = false));
          statusEl.textContent = "Ready";
        }
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => callTool(button.dataset.tool));
      });
    </script>
  </body>
</html>
