services:
  app:
    build:
      context: /opt/cronogpt/app
      dockerfile: Dockerfile
    image: cronogpt:oracle
    restart: unless-stopped
    env_file:
      - /opt/cronogpt/config/oracle.env
      - /opt/cronogpt/secrets/cronogpt.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      CRONOGPT_BUILD_TIMESTAMP: ${CRONOGPT_BUILD_TIMESTAMP:-unknown}
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    shm_size: "1gb"
    volumes:
      - /opt/cronogpt/state:/opt/cronogpt/state

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - /opt/cronogpt/config/oracle.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/cronogpt/app/deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
